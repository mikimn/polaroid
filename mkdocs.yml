site_name: Droid UVC
site_description: Stream UVC cameras on Android with libuvc and Jetpack Compose
site_url: https://mikimn.github.io/droiduvc/
repo_url: https://github.com/mikimn/droiduvc
repo_name: mikimn/droiduvc
edit_uri: ""

# README.md and CLAUDE.md stay the single source of truth; the pages in docs/
# only include them (docs/assets links to the repo's assets/).
nav:
  - Home: index.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.top

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
