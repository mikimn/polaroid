version: 2
updates:
  # Keep the third-party GitHub Actions used by the workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Gradle dependencies and plugins, including the version catalog.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
