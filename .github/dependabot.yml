version: 2
updates:
  # Keep the third-party GitHub Actions used by the workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Gradle dependencies and plugins, including the version catalog.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
    ignore:
      # All entries in this block exist only until the toolchain migration tracked in #41 lands; remove them together.
      # Every AGP update now fails: AGP 8.13 relies on a Gradle internal API removed in Gradle 9.6, and the
      # wrapper is on 9.8; AGP 9 needs a hand-written migration. Dependabot names catalog plugins by their
      # catalog key (`agp`, as in #33), so the key and the plugin ids are all listed. Remove with the migration.
      - dependency-name: "agp"
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
      # Kotlin 2.x needs the Compose compiler Gradle plugin, the `compilerOptions` DSL and AGP 9, and raises the
      # Kotlin version consumers of the published AAR need: part of the same migration. Minor/patch still arrive.
      - dependency-name: "kotlin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major"]
      # Chained updates that need AGP 8.13+/9.1+ and so cannot be applied on their own.
      # Remove once the toolchain migration has landed.
      - dependency-name: "com.vanniktech.maven.publish"
      - dependency-name: "androidx.compose:compose-bom"
      # core-ktx 1.19 requires compileSdk 37 (verified: `checkDebugAarMetadata` fails on 35).
      - dependency-name: "androidx.core:core-ktx"
