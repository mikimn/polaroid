name: Release

# Two ways to run it:
#  - Push a tag like v0.1.0 (it must match VERSION_NAME in gradle.properties and point at a commit on main):
#    builds, publishes to Maven Central and publishes the GitHub Release.
#  - Run it by hand from the Actions tab on the main branch ("Run workflow"): the tag is taken from VERSION_NAME.
#    With "publish" unchecked (the default) it only builds, tests and creates/updates a DRAFT GitHub Release with
#    the artifacts so you can inspect them; with "publish" checked it also publishes to Maven Central (irreversible)
#    and publishes the release, creating the v<VERSION_NAME> tag on the commit it ran on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Maven Central (irreversible) and publish the GitHub Release
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # contents: write is only used by the `gh release` steps, which receive the token explicitly.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false # keep the write token away from the Gradle build

      - name: Check the tag and decide what to do
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          # No `git fetch`/`git ls-remote` here: the checkout deliberately keeps no credentials (persist-credentials:
          # false) and this repository is private, so network git commands fail. fetch-depth: 0 already brought in
          # every branch (origin/main) and tag.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            PUBLISH=true
            if [ "v$version" != "$TAG" ]; then
              echo "Tag $TAG does not match VERSION_NAME=$version in gradle.properties" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Tag $TAG is not on a commit reachable from main" >&2
              exit 1
            fi
          else
            # Manual run: only from main, and never onto a tag that already points somewhere else.
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Run this workflow on the main branch (it was run on $GITHUB_REF)" >&2
              exit 1
            fi
            TAG="v$version"
            PUBLISH="${PUBLISH_INPUT:-false}"
            existing=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists on another commit ($existing); bump VERSION_NAME first" >&2
              exit 1
            fi
          fi
          echo "Releasing $TAG (version $version), publish=$PUBLISH"
          {
            echo "TAG=$TAG"
            echo "VERSION=$version"
            echo "PUBLISH=$PUBLISH"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Keep these in sync with ndkVersion / cmake version in droiduvc/build.gradle
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Test
        run: ./gradlew test lint :droiduvc:nativeTest --stacktrace

      - name: Build the library AARs
        run: ./gradlew :droiduvc:assembleRelease :droiduvc-compose:assembleRelease --stacktrace

      - name: Decode the release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: shipping the debug-signed APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the example APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew :app:assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "droiduvc-$VERSION.apk"
          else
            ./gradlew :app:assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "droiduvc-$VERSION-debug.apk"
          fi
          cp droiduvc/build/outputs/aar/droiduvc-release.aar "droiduvc-$VERSION.aar"
          cp droiduvc-compose/build/outputs/aar/droiduvc-compose-release.aar "droiduvc-compose-$VERSION.aar"

      # The GitHub Release is created as a draft first and published last. Maven Central cannot be
      # undone or re-run for a version, so everything that can fail cheaply happens before it, and
      # every step below is safe to re-run.
      - name: Create or update the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # --target only matters when the tag does not exist yet (manual runs): it is created on this commit
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --draft --generate-notes --title "Droid UVC $TAG" --target "$GITHUB_SHA" $prerelease
          gh release upload "$TAG" --clobber droiduvc-*.aar droiduvc-*.apk

      - name: Publish to Maven Central
        if: env.PUBLISH == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set=0
          for v in "$ORG_GRADLE_PROJECT_mavenCentralUsername" "$ORG_GRADLE_PROJECT_mavenCentralPassword" \
                   "$ORG_GRADLE_PROJECT_signingInMemoryKey" "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"; do
            [ -n "$v" ] && set=$((set + 1))
          done
          if [ "$set" -eq 0 ]; then
            echo "::warning::Maven Central secrets are not configured; skipping publication."
            exit 0
          fi
          if [ "$set" -ne 4 ]; then
            echo "::error::Only $set of 4 Maven Central secrets are set (MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY, SIGNING_KEY_PASSWORD); refusing to publish." >&2
            exit 1
          fi
          # Each module is probed and published on its own, so a rerun after a partial failure (say droiduvc
          # went out and droiduvc-compose failed validation) still publishes whatever is missing.
          for module in droiduvc droiduvc-compose; do
            if curl -fsI "https://repo1.maven.org/maven2/io/github/mikimn/$module/$VERSION/$module-$VERSION.pom" > /dev/null; then
              echo "$module $VERSION is already on Maven Central; skipping."
            else
              ./gradlew ":$module:publishAndReleaseToMavenCentral" --stacktrace
            fi
          done

      - name: Publish the GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
