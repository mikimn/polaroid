import javax.inject.Inject
import org.gradle.process.ExecOperations

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace 'com.mikimn.libpolaroid'
    compileSdk 35
    ndkVersion '30.0.16248370'

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    defaultConfig {
        minSdk 24
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                abiFilters "arm64-v8a", "x86_64"
            }
        }

    }

    testOptions {
        // android.util.Log etc. are no-ops in JVM unit tests
        unitTests.returnDefaultValues = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.5.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

// Host-side (no device) GoogleTest suite for the pure C++ logic in src/main/cpp/core.
abstract class NativeTest extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOperations()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getSources()

    // Must match the CMake version pinned in `android.externalNativeBuild.cmake.version`.
    @Input
    abstract Property<String> getCmakeBin()

    @OutputDirectory
    abstract DirectoryProperty getBuildDir()

    @TaskAction
    void run() {
        def bin = cmakeBin.get()
        def source = sources.files.find { it.name == 'tests' }
        def build = buildDir.get().asFile
        execOperations.exec { it.commandLine "$bin/cmake", '-S', source, '-B', build, '-GNinja', "-DCMAKE_MAKE_PROGRAM=$bin/ninja" }
        execOperations.exec { it.commandLine "$bin/cmake", '--build', build }
        execOperations.exec { it.commandLine "$bin/ctest", '--test-dir', build, '--output-on-failure' }
    }
}

tasks.register('nativeTest', NativeTest) {
    group = 'verification'
    description = 'Builds and runs the native C++ unit tests on the host machine.'
    sources.from(file('src/main/cpp/tests'), file('src/main/cpp/core'))
    cmakeBin = providers.provider { "${android.sdkDirectory}/cmake/3.22.1/bin".toString() }
    buildDir = layout.buildDirectory.dir('native-tests')
}
tasks.named('check') { dependsOn 'nativeTest' }

// Publishing. Coordinates and POM basics come from gradle.properties (GROUP, VERSION_NAME, POM_*).
// Release to Maven Central with ./gradlew publishAndReleaseToMavenCentral (needs the Central Portal
// and signing credentials as ORG_GRADLE_PROJECT_* environment variables, see README).
mavenPublishing {
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)
    if (providers.gradleProperty('signingInMemoryKey').isPresent()) {
        signAllPublications()
    }
}
